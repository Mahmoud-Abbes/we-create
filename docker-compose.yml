version: '3.8'

services:
  # The ai connector container
  ai-fastapi:
    build: ./core-services/ai-fastapi
    container_name: we-create-ai
    env_file:
      - .env
    ports:
      - "8000:8000" # Temporary for testing
    volumes:
      - ./core-services/ai-fastapi:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Main application database
  db:
    image: postgres:15
    container_name: we-create-db
    environment:
      POSTGRES_DB: wecreate_db
      POSTGRES_USER: wecreate
      POSTGRES_PASSWORD: wecreate123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Spring Boot API
  api-spring-boot:
    build: ./core-services/api-spring-boot
    container_name: we-create-api
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/wecreate_db
      SPRING_DATASOURCE_USERNAME: wecreate
      SPRING_DATASOURCE_PASSWORD: wecreate123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      KEYCLOAK_ADMIN_SERVER_URL: http://keycloak:8080/auth
      KEYCLOAK_REALM: we-create
      KEYCLOAK_ADMIN_USERNAME: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    depends_on:
      - db

  # --- THE IDENTITY PROVIDER (KEYCLOAK) ---
  keycloak-db:
    image: postgres:16
    container_name: keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_pass
    volumes:
      - keycloak_data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.4
    container_name: keycloak-server
    command: start-dev --db=postgres --db-url=jdbc:postgresql://keycloak-db:5432/keycloak --db-username=keycloak --db-password=keycloak_pass
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME: localhost
      KC_HTTP_RELATIVE_PATH: "/auth"
      KC_PROXY: edge
      KC_PROXY_HEADERS: "xforwarded"
    ports:
      - "8081:8080"
    depends_on:
      - keycloak-db
    volumes:
      - ./keycloak/providers/email-otp-authenticator-v1.3.5-kc-26.5.4.jar:/opt/keycloak/providers/email-otp-authenticator.jar
      - ./keycloak/themes:/opt/keycloak/themes

  dashboard:
    build: ./dashboard
    container_name: dashboard
    ports:
      - "4200:4000"

  site-engine:
    build: ./site-engine
    container_name: site-engine
    ports:
      - "4100:4100"

  nginx:
    image: nginx:latest
    container_name: we-create-router
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-spring-boot
      - dashboard
      - site-engine
      - keycloak

volumes:
  postgres_data:
  keycloak_data:
