<div class="step-content">
  <div class="step-main">
    <h2 class="step-title">Step 4: Handling Sections</h2>

    <div class="form-card">
      <h3 class="section-title">4. Services</h3>

      <!-- Show Section Toggle -->
      <div class="field-group">
        <div class="toggle-row">
          <span class="toggle-label">Show section</span>
          <label class="toggle-switch">
            <input type="checkbox" [(ngModel)]="servicesData.show" (change)="saveToService()" />
            <span class="toggle-track">
              <span class="toggle-thumb"></span>
            </span>
          </label>
        </div>
        <span class="field-hint">Choose to create services section</span>
      </div>

      <ng-container *ngIf="servicesData.show">

        <!-- Section Title -->
        <div class="field-group">
          <label class="field-label">
            Section Title
            <span class="info-wrap">
              <img class="info-icon" src="images/details.svg" />
              <span class="tooltip">The heading displayed at the top of your services section</span>
            </span>
          </label>
          <input
            class="field-input"
            type="text"
            [(ngModel)]="servicesData.title"
            placeholder="e.g. What We Offer"
            (input)="saveToService()"
          />
        </div>

        <!-- Section Subtitle -->
        <div class="field-group">
          <label class="field-label">Section Subtitle</label>
          <input
            class="field-input"
            type="text"
            [(ngModel)]="servicesData.description"
            placeholder="e.g. Tailored solutions for your business needs"
            (input)="saveToService()"
          />
        </div>

        <!-- Expertise Description -->
        <div class="field-group">
          <label class="field-label">
            Expertise Description <span class="required">*</span>
            <span class="info-wrap">
              <img class="info-icon" src="images/details.svg" />
              <span class="tooltip">Describe your expertise and the services you provide</span>
            </span>
          </label>
          <textarea
            class="field-textarea"
            [class.error-border]="errors.isExpertiseDescriptionEmpty"
            [(ngModel)]="servicesData.expertiseDescription"
            placeholder="e.g. We have reached over 100 clients and we have 98% client satisfaction..."
            (input)="errors.isExpertiseDescriptionEmpty = false; saveToService()"
            rows="6"
          ></textarea>
          <div class="error-message" *ngIf="errors.isExpertiseDescriptionEmpty">
            Expertise description is required when the section is shown.
          </div>
        </div>

      </ng-container>
    </div>
  </div>

  <div class="action-footer">
    <button class="back-btn" (click)="onBack()">Back</button>
    <button class="next-btn" (click)="onNext()">Next</button>
  </div>
</div>
