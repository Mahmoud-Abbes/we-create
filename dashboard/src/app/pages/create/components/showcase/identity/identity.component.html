<div class="step-content">
  <div class="step-main">
    <h2 class="step-title">Step 1: Identity & Branding</h2>

    <div class="form-card">
      <div class="field-group">
        <label class="field-label">Company Name <span class="required">*</span></label>
        <input class="field-input" [class.error-border]="errors.companyName" type="text"
          [(ngModel)]="brandIdentityData.companyName" (blur)="onFieldBlur('companyName')"
          (input)="onFieldInput('companyName')" />
        <div class="error-message" *ngIf="errors.companyName">you need to fill this field</div>
      </div>

      <div class="field-group">
        <label class="field-label">Company Tab Title</label>
        <input class="field-input" type="text" [(ngModel)]="brandIdentityData.title" />
      </div>

      <div class="field-group">
        <label class="field-label">Company Slogan</label>
        <input class="field-input" type="text" [(ngModel)]="brandIdentityData.slogan" />
      </div>

      <!-- Logo Section -->
      <div class="field-group">
        <label class="field-label">Logo/Favicon <span class="required">*</span></label>
        <div class="upload-container" [class.error-border]="errors.faviconUrl" (click)="logoInput.click()">
          <input #logoInput type="file" hidden (change)="onLogoChange($event)" accept="image/*" />
          <span class="upload-placeholder" *ngIf="!brandIdentityData.faviconUrl">choose or drag image here</span>

          <div class="image-chips" *ngIf="brandIdentityData.faviconUrl">
            <div class="image-chip">
              <span class="chip-name">{{ brandIdentityData.faviconUrl }}</span>
              <button class="chip-remove" (click)="$event.stopPropagation(); removeLogo()">
                <img src="images/cross.svg" class="remove-icon" />
              </button>
            </div>
          </div>
        </div>
        <div class="error-message" *ngIf="errors.faviconUrl">you need to fill this field</div>
      </div>

      <!-- Multiple Images Section -->
      <div class="field-group">
        <label class="field-label">Company Images</label>
        <div class="upload-container" (click)="imagesInput.click()">
          <input #imagesInput type="file" hidden multiple (change)="onCompanyImagesChange($event)" accept="image/*" />
          <span class="upload-placeholder" *ngIf="brandIdentityData.companyImages.length === 0">choose or drag images
            here</span>

          <div class="image-chips" *ngIf="brandIdentityData.companyImages.length > 0">
            <div class="image-chip" *ngFor="let imgName of brandIdentityData.companyImages; let i = index">
              <span class="chip-name">{{ imgName }}</span>
              <button class="chip-remove" (click)="$event.stopPropagation(); removeCompanyImage(i)">
                <img src="images/cross.svg" class="remove-icon" />
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="action-footer">
    <button class="back-btn" (click)="onBack()">Back</button>
    <button class="next-btn" (click)="onNext()">Next</button>
  </div>
</div>
