<div class="view-container">
  <header class="preview-header">
    <div class="project-info">
      <span class="engine-tag">WeCreate Engine</span>
      <h1 class="project-slug-title">{{ projectSlug }}</h1>
    </div>
    
    <div class="preview-controls">
      <!-- FIXED: Removed 'Fried' typo from (click) -->
      <button class="btn-refresh" (click)="loadPreview()" [disabled]="!safeUrl">
        <svg class="refresh-icon" [class.spinning]="!safeUrl" viewBox="0 0 24 24">
          <path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
        </svg>
        <span>Refresh Preview</span>
      </button>
    </div>
  </header>

  <div class="browser-frame">
    <!-- Loader logic -->
    <div *ngIf="!safeUrl" class="engine-loader">
      <div class="spinner"></div>
      <p>Negotiating Burner Token...</p>
    </div>
    
    <!-- Iframe Wrapper to avoid structural directive conflicts -->
    <div class="iframe-wrapper" *ngIf="safeUrl">
      <iframe 
        [src]="safeUrl" 
        class="preview-iframe"
        frameborder="0">
      </iframe>
    </div>
  </div>
</div>
