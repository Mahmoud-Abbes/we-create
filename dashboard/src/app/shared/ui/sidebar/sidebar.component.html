<aside class="sidebar" [class.sidebar-collapsed]="collapsed">
  <div class="sidebar-header" [class.sidebar-header-collapsed]="collapsed">
    <button class="burger-menu-btn" (click)="toggleSidebar()">
      <img src="/images/burger-menu.svg" class="icon-filter" alt="Menu" />
    </button>

    <div class="sidebar-logo-group" *ngIf="!collapsed" routerLink="/" style="cursor: pointer">
      <img src="/images/logo.png" class="sidebar-logo-img" alt="We-Create Logo" />
    </div>

    <img
      *ngIf="collapsed"
      src="/images/logo-collapse.png"
      class="sidebar-logo-collapsed-img"
      routerLink="/"
      style="cursor: pointer"
      alt="Logo"
    />
  </div>

  <button
    *ngIf="!collapsed"
    class="sidebar-new-app-btn"
    routerLink="/create"
    [class.btn-collapsed]="collapsed"
  >
    <span>Start new app</span>
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
      <path d="M9 1V17M1 9H17" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
    </svg>
  </button>

  <div class="sidebar-projects" [class.projects-collapsed]="collapsed">
    <span class="sidebar-projects-title">Your apps</span>

    <!-- ERROR STATE FOR SIDEBAR -->
    <div *ngIf="loadFailed" class="sidebar-error-container">
      <p class="sidebar-error-text">Failed to load projects</p>
      <button class="sidebar-retry-btn" (click)="loadProjects()">Try again</button>
    </div>

    <!-- LIST STATE -->
    <ul *ngIf="!loadFailed" class="sidebar-project-list">
      <li
        *ngFor="let project of projects"
        class="sidebar-project-item"
        [routerLink]="['/view', project.slug]"
        routerLinkActive="active-project"
      >
        <span class="sidebar-project-name">{{ project.slug }}</span>

      </li>
    </ul>
  </div>

  <div class="sidebar-spacer"></div>

  <div class="sidebar-user" [class.sidebar-user-collapsed]="collapsed">
    <div class="sidebar-user-info" [class.info-collapsed]="collapsed">
      <span class="sidebar-user-name">{{ authService.getUserFullName() }}</span>
      <span class="sidebar-user-handle">@{{ getFormattedUsername() }}</span>
    </div>
    <img src="/images/settings.svg" class="sidebar-user-settings icon-filter" alt="Settings" (click)="navigateToSettongs()" />
  </div>
</aside>
