# Route hashed bundles to the app that served the HTML page (wc_assets cookie from each SSR server).
# Referer is only a fallback when the cookie is absent (module imports often omit Referer).
map $cookie_wc_assets $cookie_assets_backend {
    default       "";
    "dashboard"   dashboard:4000;
    "site-engine" site-engine:4100;
}

map $http_referer $referer_assets_backend {
    default   "";
    "~^https?://[^/]+/?$" "dashboard:4000";
    "~^https?://[^/]+/(welcome|create|creating|view|billing|account-settings)" "dashboard:4000";
}

map $cookie_assets_backend $resolved_assets_backend {
    default   $cookie_assets_backend;
    ""        $referer_assets_backend;
}

map $resolved_assets_backend $assets_backend {
    default   $resolved_assets_backend;
    ""        site-engine:4100;
}

server {
    listen 80;
    
    # DNS Resolver for Docker
    resolver 127.0.0.11 valid=30s;

    # 1. Dashboard static and page requests (exact root /)
    location = / {
        proxy_pass http://dashboard:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Known Dashboard Pages
    location /welcome {
        proxy_pass http://dashboard:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /create {
        proxy_pass http://dashboard:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /creating {
        proxy_pass http://dashboard:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Preview in frontend (dashboard page)
    location /view/ {
        proxy_pass http://dashboard:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /billing/ {
        proxy_pass http://dashboard:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /account-settings {
        proxy_pass http://dashboard:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Spring Boot API
    location ^~ /api/ {
        proxy_pass http://api-spring-boot:8080/; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 5. Keycloak Auth
    location ^~ /auth {
        proxy_pass http://keycloak:8080; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Prefix /auth;
        
        # Increase timeouts for Keycloak initialization
        proxy_connect_timeout 90;
        proxy_send_timeout 90;
        proxy_read_timeout 90;
    }

    # 6. Asset requests (js, css, images, fonts, etc.)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf|json|map)$ {
        proxy_pass http://$assets_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 7. Site Engine slugs (catch-all for any other path, e.g., /my-portfolio)
    location / {
        proxy_pass http://site-engine:4100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}