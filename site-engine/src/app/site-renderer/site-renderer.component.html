<div class="engine-runtime" *ngIf="projectData">
  <div class="site-viewport">
    <router-outlet *ngIf="projectData.projectType === 'showcase'"></router-outlet>

    <app-ecommerce
      *ngIf="projectData.projectType === 'ecommerce'"
      [content]="projectData.jsonContent">
    </app-ecommerce>
  </div>
</div>

<div *ngIf="errorMessage" class="error-banner">
  <p>{{ errorMessage }}</p>
</div>
