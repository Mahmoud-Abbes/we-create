spring:
  config:
    import: "optional:file:../../../.env[.properties]"
  application:
    name: api-spring-boot
  datasource:
    url: jdbc:postgresql://db:5432/wecreate_db
    username: wecreate
    password: wecreate123
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost/auth/realms/we-create
          jwk-set-uri: http://keycloak:8080/auth/realms/we-create/protocol/openid-connect/certs

server:
  error:
    include-message: always
    include-exception: always

stripe:
  secret:
    key: ${STRIPE_SECRET_KEY}
  webhook:
    secret: ${STRIPE_WEBHOOK_SECRET}

keycloak:
  realm: ${KEYCLOAK_REALM:we-create}
  admin:
    server-url: ${KEYCLOAK_ADMIN_SERVER_URL:http://keycloak:8080/auth}
    realm: ${KEYCLOAK_ADMIN_REALM:master}
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
    username: ${KEYCLOAK_ADMIN_USERNAME:admin}
    password: ${KEYCLOAK_ADMIN_PASSWORD:admin}

# Custom Supabase Properties
supabase:
  bucket-name: ${SUPABASE_S3_BUCKET:${SUPABASE_BUCKET_NAME:}}
  s3:
    # Prefer explicit S3 vars; fall back to PROJECT_REF-derived URL if needed.
    endpoint: ${SUPABASE_S3_ENDPOINT:https://${SUPABASE_PROJECT_REF:${SUPABASE_REFERENCE_ID:}}.supabase.co/storage/v1/s3}
    access-key: ${SUPABASE_S3_ACCESS_KEY:${SUPABASE_ACCESS_KEY:}}
    secret-key: ${SUPABASE_S3_SECRET_KEY:${SUPABASE_SECRET_KEY:}}
    region: ${SUPABASE_S3_REGION:${SUPABASE_REGION:us-east-1}}